[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
rmk = { version = "0.9.0", features = ["defmt", "storage", "vial", "watchdog", "pico_w_ble", "rp2040"] }
portable-atomic = { version = "1", features = ["critical-section"] }
